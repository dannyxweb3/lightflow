name: Server verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nimbus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nimbus:ci-only-password@127.0.0.1:5432/nimbus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build and start Compose deployment
        run: |
          python3 scripts/init.py
          docker compose config --quiet
          docker compose up -d --build --wait postgres control
          python3 scripts/bootstrap.py
          docker compose up -d --build --wait gateway
          curl --fail http://127.0.0.1:8080/readyz
      - name: Run real protocol tests with packaged gateway binary
        run: |
          docker compose cp gateway:/usr/local/bin/hysteria /tmp/hysteria
          chmod +x /tmp/hysteria
          TEST_HYSTERIA_BIN=/tmp/hysteria go test -race -count=1 ./...
      - name: Shutdown
        if: always()
        run: docker compose down -v || true
