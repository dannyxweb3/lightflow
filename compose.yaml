name: nimbus
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init.py first}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [database]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  control:
    <<: *hardening
    build: {context: ., target: control}
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      DATABASE_URL: postgres://nimbus:${POSTGRES_PASSWORD}@postgres:5432/nimbus?sslmode=disable
      ADMIN_KEY: ${ADMIN_KEY:?Run init.py}
      ADMIN_CONSOLE_PASSWORD_HASH: ${ADMIN_CONSOLE_PASSWORD_HASH:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?Run init.py}
      SIGNING_KEY: ${SIGNING_KEY:?Run init.py}
      LEASE_SECONDS: ${LEASE_SECONDS:-600}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/bin/nimbus, health, "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [database, control]
  gateway:
    <<: *hardening
    build: {context: ., target: gateway}
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      CONTROL_URL: http://control:8443
      GATEWAY_ID: ${GATEWAY_ID:-gateway-1}
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:?Run scripts/upgrade_local.py for an existing .env}
      GATEWAY_TLS_CERT: /run/certs/gateway.crt
      GATEWAY_TLS_KEY: /run/certs/gateway.key
    volumes:
      - ./.local/certs/gateway.crt:/run/certs/gateway.crt:ro
      - ./.local/certs/gateway.key:/run/certs/gateway.key:ro
    ports: ["${GATEWAY_PORT:-4433}:4433/udp"]
    depends_on:
      control: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/bin/nimbus, health, "http://127.0.0.1:9080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [control]
networks:
  database: {internal: true}
  control: {}
volumes:
  pgdata: {}
